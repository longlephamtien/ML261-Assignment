name: Docs

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
      - name: Deploy MkDocs
        run: uvx --with mkdocs-material --with mkdocs-material-extensions --with pymdown-extensions --with mkdocs-jupyter mkdocs gh-deploy --force

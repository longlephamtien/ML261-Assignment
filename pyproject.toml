[project]
name = "ml261-assignment"
version = "1.0.0"
description = "Assignment for CO3117 ML, Semester 261"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "ucimlrepo>=0.0.7",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "mkdocs>=1.6.1",
    "mkdocs-jupyter>=0.26.3",
    "mkdocs-material>=9.7.7",
    "mkdocs-material-extensions>=1.3.1",
    "pymdown-extensions>=12.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
